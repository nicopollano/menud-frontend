name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:

    runs-on: ubuntu-latest
    environment: env

    strategy:
      matrix:
        app: [admin, app, linkit, menu, web]

    steps:
    - uses: actions/checkout@v4

    - name: Prepare pnpm (corepack) and debug versions
      run: |
        corepack enable
        corepack prepare pnpm@10.14.0 --activate
        corepack use pnpm@10.14.0
        node -v
        corepack --version || true
        pnpm -v || true

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.secretPass }}

    - name: Build and push image for ${{ matrix.app }}
      uses: docker/build-push-action@v6
      with:
        # Use repo root as context so Dockerfile can reference workspace-level files
        context: .
        file: ./apps/${{ matrix.app }}/Dockerfile
        push: true
        build-args: |
          APP_DIR=./apps/${{ matrix.app }}
          NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL || 'https://api.placeholder.com' }}
          NEXT_PUBLIC_LINKIT_DOMAIN=${{ vars.NEXT_PUBLIC_LINKIT_DOMAIN || 'placeholder.com' }}
          NEXT_PUBLIC_APP_DOMAIN=${{ vars.NEXT_PUBLIC_APP_DOMAIN || 'placeholder.com' }}
          NEXT_PUBLIC_API_REVALIDATE=${{ vars.NEXT_PUBLIC_API_REVALIDATE || '60' }}
          NEXTAUTH_SECRET=${{ vars.NEXTAUTH_SECRET || 'default-secret' }}
        tags: |
          ghcr.io/nicopollano/menud-frontend-${{ matrix.app }}:latest
          ghcr.io/nicopollano/menud-frontend-${{ matrix.app }}:${{ github.sha }}

    - name: Debug environment variables
      run: |
        echo "NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}"
        echo "NEXT_PUBLIC_LINKIT_DOMAIN=${{ vars.NEXT_PUBLIC_LINKIT_DOMAIN }}"
        echo "NEXT_PUBLIC_APP_DOMAIN=${{ vars.NEXT_PUBLIC_APP_DOMAIN }}"
        echo "NEXT_PUBLIC_API_REVALIDATE=${{ vars.NEXT_PUBLIC_API_REVALIDATE }}"

    - name: Debug NEXTAUTH_SECRET
      run: |
        echo "NEXTAUTH_SECRET=${{ vars.NEXTAUTH_SECRET }}"

    - name: Optionally trigger Portainer webhook
      if: env.PORTAINER_WEBHOOK != ''
      run: |
        curl -k -X POST "$PORTAINER_WEBHOOK"
